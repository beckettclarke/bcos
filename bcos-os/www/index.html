<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BCOS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #fff;
      background: #1b1f2e url("background.jpg") center / cover no-repeat fixed;
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    /* Darken the bottom so text stays readable over the clouds */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: linear-gradient(180deg, rgba(10, 12, 24, 0.15) 0%, rgba(10, 12, 24, 0.55) 100%);
      pointer-events: none;
    }

    .card {
      position: relative;
      max-width: calc(100vw - 32px);
      text-align: center;
      padding: 48px 64px;
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(24px) saturate(140%);
      -webkit-backdrop-filter: blur(24px) saturate(140%);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.35);
      animation: rise 900ms cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      opacity: 0.85;
      margin-bottom: 18px;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #4ade80;
      box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.6);
      animation: pulse 2s infinite;
    }

    h1 {
      font-size: clamp(44px, 9vw, 88px);
      font-weight: 600;
      letter-spacing: -0.03em;
      line-height: 1;
      text-shadow: 0 4px 30px rgba(0, 0, 0, 0.25);
    }

    .time {
      margin-top: 20px;
      font-size: 17px;
      font-weight: 300;
      opacity: 0.8;
      font-variant-numeric: tabular-nums;
    }

    .credit {
      position: fixed;
      right: 16px;
      bottom: 12px;
      font-size: 11px;
      opacity: 0.55;
      color: #fff;
      text-decoration: none;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(16px) scale(0.98); }
      to   { opacity: 1; transform: none; }
    }

    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.6); }
      70%  { box-shadow: 0 0 0 10px rgba(74, 222, 128, 0); }
      100% { box-shadow: 0 0 0 0 rgba(74, 222, 128, 0); }
    }

    @media (max-width: 480px) {
      .card { padding: 36px 28px; margin: 0 16px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .card, .dot { animation: none; }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="status"><span class="dot"></span>BCOS</div>
    <h1>OS ready</h1>
    <p class="time" id="time"></p>
  </main>

  <a class="credit" href="https://unsplash.com" target="_blank" rel="noopener">Photo via Unsplash</a>

  <script>
    const el = document.getElementById("time");
    const tick = () => {
      el.textContent = new Date().toLocaleString(undefined, {
        weekday: "long", month: "long", day: "numeric", hour: "numeric", minute: "2-digit"
      });
    };
    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>

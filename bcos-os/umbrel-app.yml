manifestVersion: 1
id: bcos-os
category: utilities
name: BCOS
version: "0.3.1"
tagline: Your personal OS, running on Umbrel
description: >-
  BCOS is a personal operating environment that runs as an Umbrel app: a
  calm home screen with live widgets, and a set of built-in apps for your
  calendar, tasks, notes, journal and mail. Everything you write is stored on
  your Umbrel and syncs to every device you open it on.
releaseNotes: >-
  Apps now open fullscreen with a Windows-style taskbar: Start, search,
  running apps you can switch between, minimise and close, and a clock. Mail
  connects to real accounts — iCloud, Gmail, Yahoo, Fastmail or any IMAP/SMTP
  server — to read, organise and send your email from BCOS.
